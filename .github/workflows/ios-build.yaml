# 独立 iOS 构建 workflow：手动触发，构建未签名 IPA 并发布到 GitHub Release。
# 与 build.yaml 的区别：不需要打 release tag，随时可验证 iOS 构建并拿到 IPA。
name: iOS Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag 名称（留空则自动用 ios-build-<短SHA>）'
        required: false
        default: ''
      prerelease:
        description: '标记为预发布'
        type: boolean
        required: false
        default: true

env:
  # 与 .fvmrc 保持一致（build.yaml 中的 3.44.0 已过期）
  FLUTTER_VERSION: '3.44.8'

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/doh_proxy
          key: ios

      - name: Setup iOS Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      # SwiftTryCatch 等 pod 依赖 GitHub git 仓库，用 token 避免 rate limit
      - name: Configure Git for CocoaPods
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"

      # flutterw.dart 内部会自动执行 project_prep（pub get、l10n、证书、native 预处理）
      - name: Build iOS (no-codesign)
        run: |
          dart tool/flutterw.dart build ios --release --no-codesign
          # 校验 doh_proxy Rust 动态库符号确实链入
          nm -gU build/ios/iphoneos/Runner.app/Runner | grep "_doh_proxy_start_with_config_json"

      - name: Package IPA
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          mkdir -p dist
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -rq "../../../dist/fluxdo-${SHORT_SHA}-unsigned.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluxdo-ios-unsigned
          path: ./dist/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=ios-build-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: fluxdo iOS (unsigned) ${{ steps.tag.outputs.name }}
          body: |
            未签名 IPA，手动构建。
            Commit: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || true }}
          files: ./dist/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
